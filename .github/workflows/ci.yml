name: macOS build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            artifact: moonlight-audio-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: moonlight-audio-macos-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: brew install cmake qtbase opus pkgconf

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test CLI
        run: build/moonlight-audio --help

      - name: Upload executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: build/moonlight-audio
          if-no-files-found: error
          retention-days: 14
